# Production: bitta VPS. Ishga tushirish: deploy/README.md
#   cd deploy && docker compose -f compose.prod.yml up -d --build
name: liveportal-prod

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: liveportal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env da POSTGRES_PASSWORD yo'q}
      POSTGRES_DB: liveportal
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liveportal -d liveportal"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Port tashqariga ochilmaydi: bazaga faqat API ulanadi.

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4100
      DATABASE_URL: postgresql://liveportal:${POSTGRES_PASSWORD}@postgres:5432/liveportal
      WEB_ORIGIN: https://${DOMAIN:?deploy/.env da DOMAIN yo'q}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4100/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 3

  caddy:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
